<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timone Redazione — Accesso</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f0f2f7; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
.card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
  padding: 40px 36px; width: 100%; max-width: 360px;
  box-shadow: 0 8px 32px rgba(0,0,0,.08);
}
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.logo svg { width: 44px; height: 44px; color: #FF6B35; flex-shrink: 0; }
.logo-title {
  font-size: 20px; font-weight: 800; letter-spacing: -.03em;
  background: linear-gradient(135deg, #FF6B35, #e85d28);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.logo-sub { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; display: block; }
label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #64748b; margin-bottom: 8px; }
input[type="password"] {
  width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
  font-size: 15px; color: #1e293b; outline: none; transition: border-color .15s;
}
input[type="password"]:focus { border-color: #FF6B35; }
.error { color: #dc2626; font-size: 13px; font-weight: 600; margin-top: 10px; }
button[type="submit"] {
  margin-top: 20px; width: 100%; padding: 12px; border-radius: 10px;
  background: #FF6B35; color: #fff; font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; transition: background .15s;
}
button[type="submit"]:hover { background: #e85d28; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
      <circle cx="50" cy="50" r="37" fill="none" stroke="currentColor" stroke-width="7"/>
      <line x1="50" y1="17" x2="50" y2="39" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="76.2" y1="23.8" x2="57.3" y2="42.7" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="83" y1="50" x2="61" y2="50" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="76.2" y1="76.2" x2="57.3" y2="57.3" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="50" y1="83" x2="50" y2="61" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="23.8" y1="76.2" x2="42.7" y2="57.3" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="17" y1="50" x2="39" y2="50" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="23.8" y1="23.8" x2="42.7" y2="42.7" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="50" cy="6" r="6"/><circle cx="81" cy="19" r="6"/>
      <circle cx="94" cy="50" r="6"/><circle cx="81" cy="81" r="6"/>
      <circle cx="50" cy="94" r="6"/><circle cx="19" cy="81" r="6"/>
      <circle cx="6" cy="50" r="6"/><circle cx="19" cy="19" r="6"/>
      <circle cx="50" cy="50" r="11"/>
      <circle cx="50" cy="50" r="5" fill="white"/>
    </svg>
    <div>
      <span class="logo-title">Timone</span>
      <span class="logo-sub">Redazione</span>
    </div>
  </div>
  <form method="post" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autofocus required placeholder="Username"
           style="width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;color:#1e293b;outline:none;margin-bottom:14px;transition:border-color .15s;"
           onfocus="this.style.borderColor='#FF6B35'" onblur="this.style.borderColor='#e2e8f0'">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required placeholder="Password">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit">Accedi</button>
  </form>
</div>
</body>
</html>
